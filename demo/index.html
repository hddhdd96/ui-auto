<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Volume QA Demo</title>
<style>
body { font: 16px system-ui; max-width: 900px; margin: 3rem auto; color: #172c3c; }
label { display:block; margin:1rem 0; } input, button { font:inherit; padding:.5rem; }
table { border-collapse:collapse; width:100%; } th, td { padding:1rem; border-bottom:1px solid #ddd; text-align:left; }
dialog { border:1px solid #ccc; border-radius:8px; padding:2rem; } [role=alert] { color:#b32121; }
</style></head>
<body>
<p>Local synthetic volume service · no cloud connection</p>
<section id="login"><h1>Log in</h1><form id="login-form">
<label>Username <input name="username" autocomplete="username" required></label>
<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
<button>Log in</button></form></section>
<main id="volumes" hidden>
<p role="status" aria-label="Signed in user"></p>
<h1>Volumes</h1><button id="open-create">Create volume</button>
<table><thead><tr><th>Name</th><th>Status</th><th>Size</th><th>Action</th></tr></thead><tbody></tbody></table>
</main>
<p role="alert"></p>
<dialog id="create-dialog" aria-labelledby="create-title"><h2 id="create-title">Create volume</h2>
<form id="create-form"><label>Volume name <input name="name" required></label>
<label>Size (GiB) <input name="sizeGiB" type="number" min="1" required></label>
<button>Create</button><button type="button" id="cancel-create">Cancel</button></form></dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Delete volume</h2>
<p id="delete-name"></p><button id="confirm-delete">Delete</button><button id="cancel-delete">Cancel</button></dialog>
<script type="module">
const find = selector => document.querySelector(selector);
const createDialog = find('#create-dialog');
const deleteDialog = find('#delete-dialog');
let selectedId;
async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(`Request failed: ${response.status} ${await response.text()}`);
  return response.status === 204 ? undefined : response.json();
}
function handle(action) { return event => { event.preventDefault(); action(event).catch(error => { find('[role=alert]').textContent = error.message; }); }; }
async function renderVolumes() {
  const volumes = await api('/api/v1/volumes');
  const rows = volumes.map(volume => {
    const row = document.createElement('tr');
    for (const [value, testId] of [[volume.name, null], [volume.status, 'volume-status'], [`${volume.sizeGiB} GiB`, 'volume-size']]) {
      const cell = document.createElement('td'); cell.textContent = value;
      if (testId) cell.dataset.testid = testId;
      row.append(cell);
    }
    const cell = document.createElement('td'); const button = document.createElement('button');
    button.textContent = 'Delete';
    button.onclick = () => { selectedId = volume.id; find('#delete-name').textContent = volume.name; deleteDialog.showModal(); };
    cell.append(button); row.append(cell); return row;
  });
  find('tbody').replaceChildren(...rows);
}
find('#login-form').onsubmit = handle(async event => {
  const form = new FormData(event.target);
  await api('/api/login', { method:'POST', body:JSON.stringify(Object.fromEntries(form)) });
  location.href = '/volumes';
});
find('#open-create').onclick = () => createDialog.showModal();
find('#cancel-create').onclick = () => createDialog.close();
find('#cancel-delete').onclick = () => deleteDialog.close();
find('#create-form').onsubmit = handle(async event => {
  const form = new FormData(event.target);
  await api('/api/v1/volumes', { method:'POST', body:JSON.stringify({name:form.get('name'), sizeGiB:Number(form.get('sizeGiB'))}) });
  await renderVolumes(); createDialog.close(); event.target.reset();
});
find('#confirm-delete').onclick = handle(async () => {
  await api(`/api/v1/volumes/${selectedId}`, {method:'DELETE'});
  await renderVolumes(); deleteDialog.close();
});
if (location.pathname !== '/login') {
  try {
    const user = await api('/api/me');
    find('#login').hidden = true; find('#volumes').hidden = false;
    find('[role=status]').textContent = user.user;
    await renderVolumes();
  } catch (error) { find('[role=alert]').textContent = error.message; }
}
</script></body></html>
