name: Nightly

# 매일 회귀 테스트와 Flaky 개선 전/후 비교를 실행한다.
# - regression: Flaky 플래그를 끈 상태에서 전체 스위트를 하네스로 실행
# - flaky-compare: naive와 stable을 같은 Flaky 플래그·같은 시드로 N회씩 실행해 실패율 비교(별도 job)
# - defect-detection: 결함 주입 모드마다 결함 재현 테스트가 결함을 검출하는지 확인
on:
  schedule:
    - cron: '17 18 * * *' # 매일 18:17 UTC(한국 시간 03:17)
  workflow_dispatch:
    inputs:
      runs:
        description: Flaky 비교 반복 횟수
        default: '5'

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  regression:
    name: 회귀 테스트(하네스 · Flaky 플래그 끔)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 하네스 실행(전체 스위트)
        run: npm run harness -- --suites api,ui,negative,defects,flaky-stable
      - name: 리포트·결과서 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report-${{ github.run_number }}
          path: artifacts/harness/
          retention-days: 30

  flaky-compare:
    name: Flaky 개선 전/후 비교
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: 'false'
      - name: naive · stable 반복 실행
        run: npm run flaky:compare -- --runs ${{ inputs.runs || '5' }}
      - name: 결과 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-compare-${{ github.run_number }}
          path: artifacts/flaky-compare/
          retention-days: 30

  defect-detection:
    name: 결함 검출 확인(전체 모드)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: 'false'
      - name: 결함 검출 확인
        run: npm run defects:check
